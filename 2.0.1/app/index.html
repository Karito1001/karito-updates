<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'none'">
<title>Karito Tweaks</title>
<style>
:root{--a:#ff4d3d;--a2:#ff8a3d;--on-a:#fff;--g:30%;--bg:#09090c;--p:#111116;--p2:#17171d;--b:rgba(255,255,255,.07);--b2:rgba(255,255,255,.13);--t:#f1f1f5;--m:#8d8d9b;--m2:#5f5f6d;--ok:#34d399;--warn:#fbbf24;--err:#f87171;--r:16px;
--fs:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--fd:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;--fm:"Cascadia Code","JetBrains Mono",Consolas,ui-monospace,monospace;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--t);font:14px/1.5 var(--fs);overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none}
input,textarea,.sel-text{user-select:text}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:inherit}
a{color:var(--a);cursor:pointer;text-decoration:none}
svg{display:block}
.m{color:var(--m)}.okc{color:var(--ok)}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;background:radial-gradient(700px circle at var(--mx,30%) var(--my,20%),color-mix(in srgb,var(--a) 9%,transparent),transparent 65%),radial-gradient(900px 600px at 88% -10%,color-mix(in srgb,var(--a2) 13%,transparent),transparent 70%),radial-gradient(900px 700px at -10% 110%,color-mix(in srgb,var(--a) 11%,transparent),transparent 70%),radial-gradient(1200px 800px at 50% 50%,color-mix(in srgb,var(--p2) 40%,transparent),transparent 80%),var(--bg)}
#stars{position:absolute;inset:0;width:100%;height:100%}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}}
#app{position:relative;z-index:1;display:grid;grid-template-columns:252px 1fr;height:100%}
aside{display:flex;flex-direction:column;gap:14px;padding:18px 14px;border-right:1px solid var(--b);background:color-mix(in srgb,var(--bg) 72%,transparent);backdrop-filter:blur(18px);overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:4px 8px 4px;-webkit-app-region:drag}
.brand b{display:block;font:800 21px/1 var(--fd);letter-spacing:.06em;text-transform:uppercase}
.brand small{display:block;font:600 10px/1 var(--fm);color:var(--m);letter-spacing:.34em;text-transform:uppercase;margin-top:6px}
.logo{width:38px;height:38px;flex:none;overflow:visible;filter:drop-shadow(0 0 10px color-mix(in srgb,var(--a) 65%,transparent))}
.logo .t1{fill:none;stroke:url(#lg);stroke-width:2.6;stroke-linejoin:round;stroke-dasharray:120;animation:dash 3s ease-in-out infinite alternate}
.logo .t2{fill:url(#lg);transform-origin:20px 25px;animation:pulse 2.4s ease-in-out infinite}
.logo .t3{fill:none;stroke:var(--a2);stroke-width:1;opacity:.55;transform-origin:20px 24px;animation:spin 9s linear infinite}
@keyframes dash{from{stroke-dashoffset:120}to{stroke-dashoffset:0}}
@keyframes pulse{50%{transform:scale(.72);opacity:.65}}
.nav{position:relative}
#navInd{position:absolute;left:0;right:0;top:0;height:38px;border-radius:11px;background:linear-gradient(90deg,color-mix(in srgb,var(--a) 22%,transparent),color-mix(in srgb,var(--a) 5%,transparent));box-shadow:inset 3px 0 0 var(--a);transition:transform .45s cubic-bezier(.2,.9,.2,1.1),height .3s,opacity .3s;opacity:0;pointer-events:none}
.nav h6{font:600 10px/1 var(--fm);letter-spacing:.2em;text-transform:uppercase;color:var(--m2);padding:14px 12px 7px}
.nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;color:var(--m);font-weight:500;transition:color .2s,transform .2s}
.nav a svg{width:18px;height:18px;flex:none;transition:color .2s}
.nav a:hover{color:var(--t);transform:translateX(3px)}
.nav a.on{color:var(--t)}.nav a.on svg{color:var(--a)}
.nav .cnt{margin-left:auto;font:600 10px/1 var(--fm);font-style:normal;color:var(--a);background:color-mix(in srgb,var(--a) 14%,transparent);padding:3px 6px;border-radius:6px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.mini{padding:14px;border-radius:14px;background:linear-gradient(135deg,color-mix(in srgb,var(--a) 18%,var(--p2)),var(--p));border:1px solid var(--b2)}
.mini small{color:var(--m);font-size:11px;display:block}.mini b{font:800 17px var(--fd)}
.ver{font:10px var(--fm);color:var(--m2);text-align:center}
main{position:relative;display:flex;flex-direction:column;min-width:0;height:100%;overflow:hidden}
header{display:flex;align-items:center;gap:14px;padding:16px 26px 14px;border-bottom:1px solid var(--b);-webkit-app-region:drag}
header>*{-webkit-app-region:no-drag}header .ttl{-webkit-app-region:drag;flex:1;min-width:0}
.ttl h1{font:800 24px/1.15 var(--fd);letter-spacing:-.01em}
.ttl p{color:var(--m);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search{display:flex;align-items:center;gap:8px;width:250px;padding:8px 12px;border-radius:12px;background:var(--p);border:1px solid var(--b);transition:border-color .2s,box-shadow .2s}
.search:focus-within{border-color:color-mix(in srgb,var(--a) 60%,var(--b));box-shadow:0 0 0 4px color-mix(in srgb,var(--a) 14%,transparent)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0}
.search svg{width:16px;height:16px;color:var(--m)}
kbd{font:600 10px/1 var(--fm);color:var(--m2);border:1px solid var(--b2);border-radius:6px;padding:3px 5px}
.tchips{display:flex;gap:8px}
.winctl{display:flex;margin-left:4px}
.winctl button{width:40px;height:30px;border-radius:8px;color:var(--m);font-size:15px;text-align:center}
.winctl button:hover{background:rgba(255,255,255,.08);color:var(--t)}.winctl .x:hover{background:#e81123;color:#fff}
#banner:empty{display:none}
.banner{display:flex;align-items:center;gap:10px;margin:14px 26px 0;padding:11px 16px;border-radius:14px;font-size:13px;border:1px solid}
.banner svg{width:16px;height:16px;flex:none}
.banner .bmsg{flex:1;min-width:0;line-height:1.5}.banner .bact{display:flex;gap:8px;flex:none;flex-wrap:wrap}
.mbody ol.steps{margin:0 0 0 20px;display:grid;gap:7px;color:var(--t)}
.banner.info{background:color-mix(in srgb,var(--a) 10%,transparent);border-color:color-mix(in srgb,var(--a) 30%,transparent)}
.banner.warn{background:color-mix(in srgb,var(--warn) 9%,transparent);border-color:color-mix(in srgb,var(--warn) 30%,transparent);color:#fde68a}
.banner.err{background:color-mix(in srgb,var(--err) 10%,transparent);border-color:color-mix(in srgb,var(--err) 35%,transparent);color:#fecaca}
#view{flex:1;overflow:auto;padding:24px 26px 130px}
.page{animation:pageIn .45s cubic-bezier(.2,.8,.2,1) both}
.page.noanim,.page.noanim *{animation:none!important}
.card{position:relative;background:linear-gradient(180deg,color-mix(in srgb,var(--p2) 86%,transparent),color-mix(in srgb,var(--p) 84%,transparent));border:1px solid var(--b);border-radius:var(--r);padding:18px;transition:border-color .25s,transform .25s,box-shadow .25s;animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(min(var(--d,0),16) * 32ms)}
.tws{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:14px}
.tw{cursor:pointer;display:flex;flex-direction:column;min-height:170px;outline:none}
.tw:hover{transform:translateY(-3px);border-color:var(--b2);box-shadow:0 18px 44px -24px color-mix(in srgb,var(--a) 55%,transparent)}
.tw h4{font:700 15px/1.3 var(--fd);margin:10px 0 6px}
.tw p{color:var(--m);font-size:12.5px;line-height:1.5;flex:1}
.tw-top{display:flex;align-items:center;gap:8px;min-height:22px}
.eff{font:600 10px/1 var(--fm);letter-spacing:.14em;text-transform:uppercase;color:var(--m)}
.tw-top .sw{margin-left:auto}
.tw-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:14px}
.tw.on{border-color:color-mix(in srgb,var(--a) 70%,transparent);box-shadow:0 0 0 1px color-mix(in srgb,var(--a) 28%,transparent),0 14px 40px -14px color-mix(in srgb,var(--a) var(--g),transparent)}
.tw.on::before{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(420px circle at 100% 0,color-mix(in srgb,var(--a) 13%,transparent),transparent 60%);pointer-events:none}
.tw.pend{outline:1px dashed color-mix(in srgb,var(--a) 75%,transparent);outline-offset:3px}
.tw.lock{cursor:not-allowed}.tw.lock>*:not(.lockov){opacity:.36;filter:grayscale(.6)}
.tw.act{cursor:default}
.lockov{position:absolute;top:14px;right:14px;display:flex;align-items:center;gap:6px;font:600 11px/1 var(--fm);background:rgba(0,0,0,.5);border:1px solid var(--b2);padding:6px 9px;border-radius:99px}
.lockov svg{width:13px;height:13px}
.sw{position:relative;display:block;width:40px;height:22px;border-radius:99px;background:rgba(255,255,255,.1);transition:background .3s;flex:none}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#9a9aa8;transition:transform .35s cubic-bezier(.3,1.6,.5,1),background .3s;box-shadow:0 2px 6px rgba(0,0,0,.4)}
.on>.tw-top .sw,.grp.on>.sw,.sw.on{background:linear-gradient(90deg,var(--a),var(--a2))}
.on>.tw-top .sw::after,.grp.on>.sw::after,.sw.on::after{transform:translateX(18px);background:#fff}
.pill{font:700 10px/1 var(--fm);letter-spacing:.08em;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:color-mix(in srgb,var(--a) 16%,transparent);color:var(--a);border:1px solid color-mix(in srgb,var(--a) 30%,transparent);white-space:nowrap}
.pill.t1{background:rgba(255,255,255,.06);color:#c7c7d1;border-color:var(--b2)}
.pill.t3{background:linear-gradient(90deg,rgba(245,158,11,.18),rgba(239,68,68,.18));color:#fbbf24;border-color:rgba(245,158,11,.4)}
.tag{font-size:11px;color:var(--m);padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.05)}
.tag.warn{color:var(--warn);background:color-mix(in srgb,var(--warn) 10%,transparent)}
.risk{font-size:11px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.risk::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 8px currentColor}
.risk.low{color:var(--ok)}.risk.mid{color:var(--warn)}.risk.high{color:var(--err)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:12px;font-weight:650;font-size:13.5px;transition:transform .2s,box-shadow .25s,background .2s,opacity .2s;white-space:nowrap;text-align:center}
.btn svg{width:16px;height:16px}
.btn:active{transform:scale(.97)}
.btn.pri{background:linear-gradient(135deg,var(--a),var(--a2));color:var(--on-a);box-shadow:0 8px 28px -8px color-mix(in srgb,var(--a) calc(var(--g) + 30%),transparent)}
.btn.pri:hover{transform:translateY(-2px);box-shadow:0 14px 36px -10px color-mix(in srgb,var(--a) 70%,transparent)}
.btn.ghost{background:rgba(255,255,255,.06);border:1px solid var(--b)}.btn.ghost:hover{background:rgba(255,255,255,.11)}
.btn.danger{background:color-mix(in srgb,var(--err) 15%,transparent);color:var(--err);border:1px solid color-mix(in srgb,var(--err) 35%,transparent)}
.btn.sm{padding:7px 12px;font-size:12px;border-radius:10px}
.btn:disabled{opacity:.45;pointer-events:none}
.tw-foot .btn{margin-left:auto}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;font-size:12px;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid var(--b);color:var(--m);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.acc{color:var(--a);border-color:color-mix(in srgb,var(--a) 35%,transparent)}
.chip.live::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;margin-right:7px;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h3.sec{font:700 15px/1.2 var(--fd);margin:30px 0 14px;display:flex;align-items:center;gap:10px}
h3.sec svg{width:17px;height:17px;color:var(--a)}
h3.sec small{font:500 12px/1 var(--fs);color:var(--m)}
.h2{font:800 26px/1.15 var(--fd);letter-spacing:-.01em}
.empty{padding:40px;text-align:center;color:var(--m)}
.spin{display:inline-block;width:22px;height:22px;border-radius:50%;border:3px solid rgba(255,255,255,.12);border-top-color:var(--a);animation:spin .8s linear infinite;flex:none}
.hero{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:28px 30px;overflow:hidden}
.hero h2{font:800 32px/1.08 var(--fd);letter-spacing:-.02em;margin-top:14px}
.hero h2 span{background:linear-gradient(90deg,var(--a),var(--a2));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--m);margin:10px 0 20px;max-width:540px}
.hero::after{content:"";position:absolute;right:-90px;top:-90px;width:340px;height:340px;background:conic-gradient(from 0deg,transparent,color-mix(in srgb,var(--a) 28%,transparent),transparent 40%);border-radius:50%;animation:spin 14s linear infinite;filter:blur(34px);pointer-events:none}
.ring{position:relative;width:156px;height:156px;z-index:1}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:10}.ring .bgc{stroke:rgba(255,255,255,.07)}
.ring .fgc{stroke:url(#rg);stroke-linecap:round;stroke-dasharray:326.7;stroke-dashoffset:326.7;transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{display:block;font:800 34px/1 var(--fd)}.ring .rv small{color:var(--m);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-top:16px}
.stat small{color:var(--m);font-size:12px;display:block}
.stat b{display:block;font:800 30px/1.1 var(--fd);margin-top:6px}
.stat .sub{color:var(--m2);font-size:11.5px}
.spark{height:4px;border-radius:4px;background:rgba(255,255,255,.07);margin-top:12px;overflow:hidden}
.spark i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--a2));transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.game{position:relative;overflow:hidden;padding:16px;min-height:118px;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer;color:var(--t)}
.gb{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font:800 14px/1 var(--fd);color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));box-shadow:0 8px 24px -6px var(--c1);flex:none}
.game b{display:block;font:700 14px/1.2 var(--fd);margin-top:12px}.game small{color:var(--m);font-size:11.5px}
.game::after{content:"";position:absolute;right:-50px;bottom:-70px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,var(--c1),transparent 70%);opacity:.16;transition:opacity .3s,transform .4s}
.game:hover{transform:translateY(-4px)}.game:hover::after{opacity:.34;transform:scale(1.2)}
.game.sel{border-color:var(--c1);box-shadow:0 0 0 1px var(--c1),0 14px 40px -14px var(--c1)}
.gamehead{display:flex;align-items:center;gap:18px;padding:22px;overflow:hidden;background:linear-gradient(120deg,color-mix(in srgb,var(--c1) 24%,var(--p2)),var(--p))}
.gamehead .gb{width:62px;height:62px;font-size:18px;border-radius:18px}
.gamehead h2{font:800 24px/1.1 var(--fd)}.gamehead p{color:var(--m);font-size:13px;margin-top:4px}
.gamehead .btn{margin-left:auto}
.two{display:grid;grid-template-columns:1.2fr 1fr;gap:14px}
.prot{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pv{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid var(--b);min-width:0}
.pv div{min-width:0}.pv b{font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv code{font:11px var(--fm);color:var(--m2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);flex:none}
.dot.off{background:var(--m2);box-shadow:none}
.actl{display:flex;flex-direction:column;gap:9px;font-size:12.5px}
.actl div{display:flex;gap:10px;color:var(--m)}
.actl time{font:11px/1.6 var(--fm);color:var(--m2);flex:none}
.actl .ok{color:var(--ok)}.actl .warn{color:var(--warn)}.actl .err{color:var(--err)}
.bwrap{display:grid;grid-template-columns:auto 1fr;gap:34px;align-items:center;padding:30px}
.boost{position:relative;width:224px;height:224px;border-radius:50%;display:grid;place-items:center;cursor:pointer;color:var(--t)}
.boost .ring2{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,var(--a),var(--a2),transparent 70%,var(--a));animation:spin 6s linear infinite;filter:drop-shadow(0 0 22px color-mix(in srgb,var(--a) 60%,transparent));opacity:.5;transition:opacity .4s}
.boost .ring2::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--bg)}
.boost .core{position:relative;width:180px;height:180px;border-radius:50%;display:grid;place-items:center;align-content:center;text-align:center;background:radial-gradient(circle at 50% 28%,color-mix(in srgb,var(--a) 30%,var(--p2)),var(--p));border:1px solid var(--b2);transition:transform .3s cubic-bezier(.2,.9,.2,1.3),box-shadow .4s}
.boost .core b{font:900 30px/1 var(--fd);letter-spacing:.14em}
.boost .core small{color:var(--m);font-size:12px;margin-top:8px}
.boost:hover .core{transform:scale(1.04)}.boost:active .core{transform:scale(.95)}
.boost.on .ring2{opacity:1;animation-duration:2.4s}
.boost.on .core{box-shadow:0 0 70px -6px color-mix(in srgb,var(--a) 80%,transparent),inset 0 0 40px color-mix(in srgb,var(--a) 30%,transparent)}
.boost.working .ring2{animation-duration:.7s;opacity:1}
.boost::before{content:"";position:absolute;inset:-14px;border-radius:50%;border:1px solid color-mix(in srgb,var(--a) 35%,transparent);animation:ping 2.6s cubic-bezier(0,0,.2,1) infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.25);opacity:0}}
.bstats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.bstats .card{padding:14px}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.grp{cursor:pointer;display:flex;gap:14px;align-items:flex-start;outline:none}
.grp b{display:block;font-weight:700}.grp small{color:var(--m);font-size:12px}
.grp>.sw{margin-left:auto;margin-top:2px}
.grp.on{border-color:color-mix(in srgb,var(--a) 55%,transparent)}
.svcs{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.list{display:flex;flex-direction:column;gap:8px}
.li{display:flex;align-items:center;gap:14px;padding:12px 14px}
.av{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font:800 14px var(--fd);background:linear-gradient(135deg,color-mix(in srgb,var(--a) 42%,var(--p2)),var(--p2));flex:none}
.av svg{width:18px;height:18px}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .mid code{display:block;font:11px var(--fm);color:var(--m2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li>.sw{cursor:pointer}.li.off .av{filter:grayscale(1);opacity:.5}
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.tier{padding:24px;display:flex;flex-direction:column}
.tier h4{font:800 18px/1 var(--fd)}
.tier .price{font:800 38px/1 var(--fd);margin:14px 0 4px}.tier .price small{font:500 12px var(--fs);color:var(--m)}

'use strict';
const EMBED = {"version":"2.0.0","tweaks":[{"id":"power-ultimate","name":"Ultimate-Performance-Energieplan","desc":"Aktiviert den versteckten Höchstleistungs-Plan von Windows – keine Spar-Verzögerungen beim Takt.","cat":"System","tier":0,"risk":"low","effect":"FPS","rec":true,"actions":[{"type":"plan","guid":"e9a42b02-d5df-448d-aa00-03f14749eb61"}]},{"id":"gamemode-hags","name":"Game Mode & GPU-Scheduling","desc":"Windows-Spielmodus an und hardwarebeschleunigte GPU-Planung (HAGS) aktivieren.","cat":"System","tier":0,"risk":"low","effect":"FPS","rec":true,"restart":true,"actions":[{"type":"reg","path":"HKCU:\\Software\\Microsoft\\GameBar","name":"AutoGameModeEnabled","value":1,"kind":"DWord"},{"type":"reg","path":"HKCU:\\Software\\Microsoft\\GameBar","name":"AllowAutoGameMode","value":1,"kind":"DWord"},{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers","name":"HwSchMode","value":2,"kind":"DWord"}]},{"id":"gamedvr-off","name":"Game DVR & Hintergrundaufnahme aus","desc":"Stoppt die unsichtbare Aufnahme im Hintergrund, die GPU-Leistung kostet.","cat":"System","tier":0,"risk":"low","effect":"FPS","rec":true,"actions":[{"type":"reg","path":"HKCU:\\System\\GameConfigStore","name":"GameDVR_Enabled","value":0,"kind":"DWord"},{"type":"reg","path":"HKCU:\\Software\\Microsoft\\Windows\\CurrentVersion\\GameDVR","name":"AppCaptureEnabled","value":0,"kind":"DWord"}]},{"id":"windowed-opt","name":"Fenster-Spiele-Optimierung","desc":"Moderner Darstellungsweg für Borderless- und Fensterspiele: weniger Latenz, VRR möglich.","cat":"System","tier":1,"risk":"low","effect":"Latenz","rec":true,"actions":[{"type":"regkv","path":"HKCU:\\Software\\Microsoft\\DirectX\\UserGpuPreferences","name":"DirectXUserGlobalSettings","key":"SwapEffectUpgradeEnable","val":"1"}]},{"id":"power-throttle-off","name":"Power-Throttling aus","desc":"Windows bremst Programme im Hintergrund nicht mehr künstlich aus. Auf Laptops etwas mehr Verbrauch.","cat":"System","tier":1,"risk":"low","effect":"FPS","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Power\\PowerThrottling","name":"PowerThrottlingOff","value":1,"kind":"DWord"}]},{"id":"fast-startup-off","name":"Schnellstart aus","desc":"Echter Kaltstart beim Herunterfahren: Treiber und Speicher starten jedes Mal frisch.","cat":"System","tier":1,"risk":"low","effect":"Stabilität","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\Power","name":"HiberbootEnabled","value":0,"kind":"DWord"}]},{"id":"mmcss-games","name":"Spiele-Priorität (MMCSS)","desc":"Spiele bekommen bei CPU, GPU und Datenträger Vorrang vor Hintergrund-Aufgaben.","cat":"System","tier":2,"risk":"mid","effect":"FPS","actions":[{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Multimedia\\SystemProfile","name":"SystemResponsiveness","value":10,"kind":"DWord"},{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Multimedia\\SystemProfile\\Tasks\\Games","name":"GPU Priority","value":8,"kind":"DWord"},{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Multimedia\\SystemProfile\\Tasks\\Games","name":"Priority","value":6,"kind":"DWord"},{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Multimedia\\SystemProfile\\Tasks\\Games","name":"Scheduling Category","value":"High","kind":"String"},{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Multimedia\\SystemProfile\\Tasks\\Games","name":"SFIO Priority","value":"High","kind":"String"}],"info":"Bewirkt: Der Multimedia-Planer von Windows gibt Spielen mehr CPU-, GPU- und Datenträger-Vorrang und hält weniger Zeit für Hintergrundaufgaben frei (SystemResponsiveness 10 statt 20). Achtung: Downloads, Streams oder Aufnahmen im Hintergrund werden etwas langsamer."},{"id":"prio-sep","name":"Vordergrund-Boost","desc":"Das aktive Spiel bekommt mehr CPU-Zeit als Programme im Hintergrund.","cat":"System","tier":2,"risk":"mid","effect":"Latenz","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\PriorityControl","name":"Win32PrioritySeparation","value":38,"kind":"DWord"}],"info":"Bewirkt: Das Programm im Vordergrund – dein Spiel – bekommt längere und häufigere CPU-Zeitscheiben. Achtung: Encoder, Downloads und andere Hintergrundprogramme laufen langsamer, solange das Spiel vorne ist."},{"id":"vbs-off","name":"Speicher-Integrität (VBS) aus","desc":"Kann spürbar FPS bringen, senkt aber den Schutz vor Schadsoftware. Bei Anti-Cheat-Problemen zurücksetzen.","cat":"System","tier":2,"risk":"high","effect":"FPS","restart":true,"note":"Sicherheits-Abwägung","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard","name":"EnableVirtualizationBasedSecurity","value":0,"kind":"DWord"},{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\DeviceGuard\\Scenarios\\HypervisorEnforcedCodeIntegrity","name":"Enabled","value":0,"kind":"DWord"}],"info":"Bewirkt: Schaltet virtualisierungsbasierte Sicherheit und Speicher-Integrität ab; in CPU-lastigen Spielen bringt das oft einige Prozent FPS. Achtung: senkt den Schutz vor Schadsoftware und Treiber-Angriffen. Manche Anti-Cheats wie Vanguard oder FACEIT verlangen VBS – dann zurücksetzen. Wirkt nach einem Neustart."},{"id":"svchost-group","name":"Dienste bündeln (weniger Prozesse)","desc":"Windows startet Dienste wieder gemeinsam statt jeden einzeln – oft 40 bis 80 Prozesse weniger. Kein Dienst wird abgeschaltet.","cat":"System","tier":2,"risk":"mid","effect":"Prozesse","restart":true,"note":"größter Prozess-Hebel","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control","name":"SvcHostSplitThresholdInKB","value":4294967295,"kind":"DWord"}],"info":"Bewirkt: Windows startet Dienste wieder gemeinsam in wenigen Prozessen statt jeden einzeln – meist 40 bis 80 Prozesse weniger und etwas weniger RAM. Achtung: Stürzt ein Dienst ab, kann er die anderen seiner Gruppe mitreißen. FPS bringt es nicht."},{"id":"maintenance-off","name":"Automatische Wartung aus","desc":"Keine Wartungs-Lastspitzen mehr im Hintergrund, während du spielst. Wartung startest du bei Bedarf selbst.","cat":"System","tier":2,"risk":"mid","effect":"Stabilität","actions":[{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows NT\\CurrentVersion\\Schedule\\Maintenance","name":"MaintenanceDisabled","value":1,"kind":"DWord"}],"info":"Bewirkt: Die automatische Wartung (Defragmentierung, Diagnose, Aufräumen) startet nicht mehr von selbst und erzeugt keine Lastspitzen beim Spielen. Achtung: Starte die Wartung ab und zu selbst über Systemsteuerung → Sicherheit und Wartung."},{"id":"wer-off","name":"Fehlerberichte aus","desc":"Windows sammelt und sendet keine Absturzberichte mehr – weniger Hintergrundarbeit nach Abstürzen.","cat":"System","tier":1,"risk":"low","effect":"Prozesse","rec":true,"actions":[{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows\\Windows Error Reporting","name":"Disabled","value":1,"kind":"DWord"}]},{"id":"timer-global","name":"Globale Timer-Auflösung","desc":"Stellt das alte Verhalten wieder her: Eine feine Timer-Auflösung eines Spiels gilt systemweit.","cat":"System","tier":2,"risk":"mid","effect":"Latenz","restart":true,"note":"umstritten","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\Session Manager\\kernel","name":"GlobalTimerResolutionRequests","value":1,"kind":"DWord"}],"tags":["delay"],"info":"Bewirkt: Unter Windows 11 gilt eine angeforderte Timer-Auflösung, etwa 0,5 ms aus Karito, wieder für das ganze System statt nur für das anfordernde Programm. Voraussetzung für die Timer-Option. Achtung: etwas mehr Stromverbrauch, solange eine feine Auflösung aktiv ist. Neustart nötig, unter Windows 10 ohne Wirkung."},{"id":"memcomp-off","name":"Speicherkomprimierung aus","desc":"Windows komprimiert keinen Arbeitsspeicher mehr – spart CPU-Zeit. Nur mit 16 GB RAM oder mehr sinnvoll.","cat":"System","tier":2,"risk":"mid","effect":"FPS","restart":true,"note":"ab 16 GB RAM","actions":[{"type":"mmagent","enable":false}],"info":"Bewirkt: Windows komprimiert keinen Arbeitsspeicher mehr und spart dafür CPU-Zeit. Achtung: nur ab 16 GB RAM sinnvoll – mit wenig RAM lagert Windows mehr auf die Festplatte aus, dann ruckelt es eher."},{"id":"svc-search-off","name":"Windows-Suchindex aus","desc":"Der Suchdienst indexiert nicht mehr im Hintergrund. Die Startmenü-Suche funktioniert weiter, Dateisuche wird langsamer.","cat":"System","tier":2,"risk":"mid","effect":"Prozesse","restart":true,"actions":[{"type":"svc","name":"WSearch","start":"disabled"}],"info":"Bewirkt: Der Suchindex durchsucht keine Dateien mehr im Hintergrund – weniger Last auf Festplatte und CPU. Achtung: Die Suche in Startmenü und Explorer findet Dateiinhalte langsamer; Apps und Einstellungen findet sie weiter."},{"id":"svc-print-off","name":"Druckdienst aus (kein Drucker)","desc":"Nur wenn du keinen Drucker nutzt – danach kann der PC nicht mehr drucken.","cat":"System","tier":2,"risk":"mid","effect":"Prozesse","restart":true,"note":"Drucken aus","actions":[{"type":"svc","name":"Spooler","start":"disabled"}],"info":"Bewirkt: Die Druckwarteschlange startet nicht mehr, ein Dienst weniger. Achtung: Drucken und „Als PDF drucken“ funktionieren erst nach dem Zurücksetzen wieder."},{"id":"svc-misc-off","name":"Link-Tracking & Offline-Karten aus","desc":"Zwei Dienste, die ein Gaming-PC nicht braucht.","cat":"System","tier":1,"risk":"low","effect":"Prozesse","restart":true,"actions":[{"type":"svc","name":"TrkWks","start":"disabled"},{"type":"svc","name":"MapsBroker","start":"disabled"}]},{"id":"svc-iphlp-off","name":"IP-Hilfsdienst aus","desc":"Dienst für IPv6-Übergangstechniken. Xbox-Party-Chat kann danach schlechter verbinden.","cat":"System","tier":2,"risk":"mid","effect":"Prozesse","restart":true,"note":"Xbox-Party","actions":[{"type":"svc","name":"iphlpsvc","start":"disabled"}],"info":"Bewirkt: Der IP-Hilfsdienst für IPv6-Tunnel (Teredo, 6to4) startet nicht mehr. Achtung: Wer IPv6-Tunnel, manche VPNs oder den Xbox-Party-Chat nutzt, lässt ihn besser an."},{"id":"svc-sync-off","name":"Mail- & Kalender-Sync aus","desc":"Die Windows-Mail- und Kalender-Synchronisierung läuft nicht mehr im Hintergrund.","cat":"System","tier":2,"risk":"mid","effect":"Prozesse","restart":true,"actions":[{"type":"svc","name":"OneSyncSvc","start":"disabled"}],"info":"Bewirkt: Die Synchronisierung der Windows-Apps Mail, Kalender und Kontakte läuft nicht mehr im Hintergrund. Achtung: Diese Apps aktualisieren sich erst nach dem Zurücksetzen wieder."},{"id":"hibernate-off","name":"Ruhezustand aus","desc":"Löscht die Ruhezustandsdatei hiberfil.sys – spart oft mehrere GB auf C:. Der Schnellstart ist dann ebenfalls aus.","cat":"System","tier":1,"risk":"low","effect":"Speicher","actions":[{"type":"hiber"}]},{"id":"fth-off","name":"Fehlertoleranter Heap aus","desc":"Windows bremst Programme, die schon einmal abgestürzt sind, nicht mehr mit Schutz-Ebenen aus.","cat":"System","tier":1,"risk":"low","effect":"FPS","actions":[{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\FTH","name":"Enabled","value":0,"kind":"DWord"}]},{"id":"ntfs-lastaccess-off","name":"Zugriffszeit-Stempel aus","desc":"NTFS schreibt nicht bei jedem Lesen einen Zeitstempel – weniger Schreibzugriffe auf die SSD.","cat":"System","tier":1,"risk":"low","effect":"Stabilität","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\FileSystem","name":"NtfsDisableLastAccessUpdate","value":2147483649,"kind":"DWord"}]},{"id":"gamedvr-policy","name":"Game DVR per Richtlinie aus","desc":"Schaltet die Hintergrundaufnahme systemweit ab – auch für neue Benutzerkonten.","cat":"System","tier":1,"risk":"low","effect":"FPS","actions":[{"type":"reg","path":"HKLM:\\SOFTWARE\\Policies\\Microsoft\\Windows\\GameDVR","name":"AllowGameDVR","value":0,"kind":"DWord"}]},{"id":"gamebar-tips-off","name":"Game-Bar-Tipps aus","desc":"Kein Einblend-Hinweis der Game Bar mehr beim Spielstart.","cat":"System","tier":0,"risk":"low","effect":"Komfort","actions":[{"type":"reg","path":"HKCU:\\Software\\Microsoft\\GameBar","name":"ShowStartupPanel","value":0,"kind":"DWord"}]},{"id":"process-diet","name":"Prozess-Diät","desc":"Alles, was dauerhaft Prozesse spart, in einem Rutsch: Dienste bündeln, Suchindex, Sync, Link-Tracking, Widgets, Hintergrund-Apps, Werbung, Fehlerberichte, KI-Schnappschüsse sowie Edge und Chrome im Hintergrund. Ziel: deutlich unter 150 Prozesse.","cat":"System","tier":3,"risk":"mid","effect":"Prozesse","includes":["svchost-group","svc-search-off","svc-sync-off","svc-misc-off","widgets-off","bg-apps-off","tips-off","wer-off","ai-off","edge-bg-off","chrome-bg-off","copilot-off","gamebar-tips-off"],"info":"Bewirkt: Bündelt Dienste und schaltet Suchindex, Sync, Fehlerberichte, Widgets, Hintergrund-Apps, KI-Funktionen und Werbung ab – deutlich weniger Prozesse und Hintergrundlast. Achtung: enthält fortgeschrittene Tweaks; was jeder einzelne bewirkt, steht bei ihm."},{"id":"perf-max","name":"Leistungs-Maximum","desc":"Energieplan, CPU-Boost, Energiepräferenz, Mindesttakt, PCIe-, SSD- und USB-Energiesparen, Power-Throttling, Spiele-Priorität, Vordergrund-Boost und globale Timer-Auflösung – alles auf Leistung.","cat":"System","tier":3,"risk":"mid","effect":"FPS","includes":["power-ultimate","cpu-boost-aggr","cpu-epp-max","cpu-min-100","pcie-aspm-off","ahci-lpm-off","disk-idle-off","usb-suspend-off","usb3-lpm-off","power-throttle-off","mmcss-games","prio-sep","timer-global"],"info":"Bewirkt: Höchstleistungs-Plan, kein Core Parking, aggressiver Boost, Vordergrund-Boost und MMCSS-Vorrang – die CPU bleibt immer voll bereit. Achtung: mehr Stromverbrauch und Wärme, auf Laptops nur am Netzteil sinnvoll."},{"id":"pcie-aspm-off","name":"PCIe-Energiesparen aus","desc":"Grafikkarte und SSD bleiben voll angebunden – keine Aufwach-Verzögerung.","cat":"Energie","tier":1,"risk":"low","effect":"Latenz","rec":true,"actions":[{"type":"pwr","sub":"501a4d13-42af-4429-9fd1-a8218c268e20","set":"ee12f906-d277-404b-b6da-e5fa1a576df5","value":0}],"tags":["delay"]},{"id":"disk-idle-off","name":"Datenträger nie abschalten","desc":"Kein Nachlade-Ruckler, weil eine Festplatte erst wieder anlaufen muss.","cat":"Energie","tier":1,"risk":"low","effect":"Stabilität","actions":[{"type":"pwr","sub":"0012ee47-9041-4b5d-9b77-535fba8b1442","set":"6738e2c4-e8a5-4a42-b16a-e040e769756e","value":0}]},{"id":"cpu-min-100","name":"CPU-Mindesttakt 100 %","desc":"Der Prozessor taktet nicht mehr herunter. Mehr Wärme und Verbrauch.","cat":"Energie","tier":2,"risk":"mid","effect":"Latenz","actions":[{"type":"pwr","sub":"54533251-82be-4824-96c1-47b60b740d00","set":"893dee8e-2bef-41e0-89c6-b55d0929964c","value":100}],"info":"Bewirkt: Die CPU taktet nie herunter, es gibt keine Verzögerung beim Hochtakten. Achtung: mehr Stromverbrauch und Wärme, auf Laptops nur am Netzteil."},{"id":"core-park-off","name":"Core Parking aus","desc":"Alle Kerne bleiben wach. Nicht für Ryzen 7950X3D/9950X3D – dort steuert Parking die Spiele-Kerne.","cat":"Energie","tier":2,"risk":"mid","effect":"FPS","note":"CPU-abhängig","actions":[{"type":"pwr","sub":"54533251-82be-4824-96c1-47b60b740d00","set":"0cc5b647-c1df-4637-891a-dec35c318583","value":100}],"tags":["delay"],"info":"Bewirkt: Windows legt keine CPU-Kerne schlafen, alle sind sofort einsatzbereit. Achtung: etwas mehr Verbrauch im Leerlauf. Bei Intel-CPUs mit P- und E-Kernen verteilt Windows Last anders – meist gut, in einzelnen Spielen nicht."},{"id":"cpu-boost-aggr","name":"CPU-Boost aggressiv","desc":"Der Prozessor taktet bei Last sofort maximal hoch.","cat":"Energie","tier":1,"risk":"low","effect":"FPS","actions":[{"type":"pwr","sub":"54533251-82be-4824-96c1-47b60b740d00","set":"be337238-0d82-4146-a960-4f3749d470c7","value":2}]},{"id":"cpu-epp-max","name":"Energiepräferenz: Höchstleistung","desc":"Moderne CPUs bevorzugen Leistung statt Strom sparen (EPP 0). Mehr Verbrauch.","cat":"Energie","tier":2,"risk":"mid","effect":"Latenz","actions":[{"type":"pwr","sub":"54533251-82be-4824-96c1-47b60b740d00","set":"36687f9e-e3a5-4dbf-b1dc-15eb381c6863","value":0}],"info":"Bewirkt: Die Energiepräferenz der CPU steht auf maximale Leistung, sie boostet schneller und länger. Achtung: mehr Wärme und Lüftergeräusch, auf Laptops kürzere Akkulaufzeit."},{"id":"cpu-idle-off","name":"CPU-Leerlauf aus (C-States)","desc":"Die CPU geht nie in den Leerlauf – minimal weniger Latenz, aber sehr hohe Temperatur. Nur Desktop mit guter Kühlung.","cat":"Energie","tier":3,"risk":"high","effect":"Latenz","note":"sehr heiß","actions":[{"type":"pwr","sub":"54533251-82be-4824-96c1-47b60b740d00","set":"5d76a2ca-e8c0-402f-a133-2158492d58ad","value":1}],"tags":["delay"],"info":"Bewirkt: Die CPU bleibt immer in ihrem aktiven Zustand (keine C-States) – minimal kürzere Reaktionszeiten. Achtung: Sie läuft dann dauerhaft unter Volllast-Spannung: deutlich mehr Wärme und Verbrauch, auch im Leerlauf, und bei manchen CPUs sogar weniger Boost. Nur zum Testen und danach zurücksetzen."},{"id":"ahci-lpm-off","name":"SSD-Verbindung immer aktiv","desc":"Die Verbindung zu SSD und Festplatte schläft nicht ein – keine Nachlade-Hänger.","cat":"Energie","tier":1,"risk":"low","effect":"Stabilität","rec":true,"actions":[{"type":"pwr","sub":"0012ee47-9041-4b5d-9b77-535fba8b1442","set":"0b2d69d7-a2a1-449c-9680-f91c70521c60","value":0}],"tags":["delay"]},{"id":"mpo-off","name":"Multi-Plane Overlay aus","desc":"Behebt auf vielen NVIDIA-Systemen Flackern und Mikroruckler. Wirkt nicht auf jeder Windows-Version.","cat":"Grafik","tier":2,"risk":"mid","effect":"Stabilität","restart":true,"note":"Fix bei Rucklern","actions":[{"type":"reg","path":"HKLM:\\SOFTWARE\\Microsoft\\Windows\\Dwm","name":"OverlayTestMode","value":5,"kind":"DWord"}],"retired":"wirkt unter Windows 11 24H2/25H2 nicht mehr zuverlässig und kann Bildflackern auslösen"},{"id":"autohdr-off","name":"Auto-HDR aus","desc":"Spart GPU-Leistung – nur relevant, wenn du einen HDR-Monitor hast.","cat":"Grafik","tier":1,"risk":"low","effect":"FPS","actions":[{"type":"regkv","path":"HKCU:\\Software\\Microsoft\\DirectX\\UserGpuPreferences","name":"DirectXUserGlobalSettings","key":"AutoHDREnable","val":"0"}]},{"id":"vrr-windowed","name":"VRR für Fensterspiele","desc":"G-Sync/FreeSync auch in Borderless-Spielen. Nur mit VRR-Monitor sinnvoll.","cat":"Grafik","tier":1,"risk":"low","effect":"Latenz","actions":[{"type":"regkv","path":"HKCU:\\Software\\Microsoft\\DirectX\\UserGpuPreferences","name":"DirectXUserGlobalSettings","key":"VRROptimizeEnable","val":"1"}]},{"id":"nv-overlay-svc","name":"NVIDIA-App-Dienst nur bei Bedarf","desc":"Der NVIDIA-Container startet nicht mehr automatisch – Overlay und Instant Replay sind dann aus.","cat":"Grafik","tier":2,"risk":"mid","effect":"Prozesse","restart":true,"note":"NVIDIA","actions":[{"type":"svc","name":"NvContainerLocalSystem","start":"manual"}],"info":"Bewirkt: Der Dienst der NVIDIA-App startet nur noch bei Bedarf statt immer mit Windows. Achtung: Overlay, Instant Replay und Treiber-Hinweise der NVIDIA-App starten erst, wenn du die App öffnest."},{"id":"tdr-delay","name":"Grafiktreiber-Timeout länger","desc":"Windows wartet 8 statt 2 Sekunden, bevor es den Grafiktreiber neu startet – weniger „Treiber reagiert nicht mehr“-Abstürze unter Volllast.","cat":"Grafik","tier":2,"risk":"mid","effect":"Stabilität","restart":true,"note":"Fix bei Treiber-Abstürzen","actions":[{"type":"reg","path":"HKLM:\\SYSTEM\\CurrentControlSet\\Control\\GraphicsDrivers","name":"TdrDelay","value":8,"kind":"DWord"}],"info":"Bewirkt: Windows wartet 8 statt 2 Sekunden, bevor es einen hängenden Grafiktreiber neu startet – weniger Abstürze bei kurzen Lastspitzen. Achtung: Hängt der Treiber wirklich, bleibt das Bild länger stehen. Neustart nötig."},{"id":"transparency-off","name":"Transparenzeffekte aus","desc":"Startmenü, Taskleiste und Fenster werden nicht mehr durchscheinend – entlastet vor allem Laptops und schwache Grafikkarten.", document.addEventListener('input', e => { const t = e.target; if (t && t.id === 'btarget') S.mon.target = t.value.trim(); if (t && t.id === 'bexe') S.mon.exe = t.value.trim(); });
document.addEventListener('change', e => { if (e.target.id === 'mchk') document.querySelectorAll('#mbox [data-need]').forEach(b => { b.disabled = !e.target.checked; }); });
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'q') {
    S.q = t.value.trim();
    if (S.q) { if (S.view !== 'search') { S.prev = S.view; S.view = 'search'; } }
    else if (S.view === 'search') S.view = S.prev;
    render();
  } else if (t.id === 'cp') setAccent(t.value, true);
  else if (t.id === 'hx') { if (/^#[0-9a-f]{6}$/i.test(t.value)) setAccent(t.value, true); }
  else if (t.id === 'gl') { P.g = Number(t.value) || 0; applyPrefs(); savePrefs(); }
  else if (t.id === 'rq') { S.rq = t.value; renderResults(); }
});
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); $('#q').focus(); $('#q').select(); return; }
  if (e.key === 'Escape') {
    if (!$('#modal').hidden && $('#modal').dataset.dismiss === '1') { closeModal(null); return; }
    if (S.q) { $('#q').value = ''; S.q = ''; S.view = S.prev; render(); return; }
  }
  const t = e.target;
  if (t && t.id === 'lkey' && e.key === 'Enter') { activate(); return; }
  if (t && (t.id === 'lname' || t.id === 'lkey2') && e.key === 'Enter') { doLogin(false); return; }
  if ((e.key === 'Enter' || e.key === ' ') && t && t.dataset && t.dataset.act && t.tagName !== 'BUTTON' && t.tagName !== 'INPUT') { e.preventDefault(); t.click(); }
});
let mvQueued = false;
addEventListener('mousemove', e => { if (mvQueued) return; mvQueued = true; requestAnimationFrame(() => { mvQueued = false; const s = $('#bg').style; s.setProperty('--mx', e.clientX + 'px'); s.setProperty('--my', e.clientY + 'px'); Stars.mouse(e.clientX, e.clientY); }); });
addEventListener('resize', () => requestAnimationFrame(moveInd));

// ---------------------------------------------------------------- Sternenhimmel
const Stars = (() => {
  let cv = null, cx = null, W = 0, H = 0, layers = [], mx = 0, my = 0, tx = 0, ty = 0, raf = 0, shoot = null, nextShoot = 0, acc = '#ff4d3d', on = true;
  const rnd = (a, b) => a + Math.random() * (b - a);
  const calm = () => document.body.classList.contains('calm');
  function build() {
    if (!cv) return;
    const dpr = Math.min(2, window.devicePixelRatio || 1);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.max(1, Math.round(W * dpr)); cv.height = Math.max(1, Math.round(H * dpr));
    cx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const base = W * H / 7000;
    layers = [[0.25, 0.9, 0.3, 0.9], [0.55, 0.45, 0.6, 1.3], [1, 0.16, 1.0, 2.0]].map(([depth, f, r0, r1]) => ({depth, stars:Array.from({length:Math.max(10, Math.round(base * f))}, () => ({x:rnd(-80, W + 80), y:rnd(-80, H + 80), r:rnd(r0, r1), a:rnd(0.35, 1), ph:rnd(0, 6.283), sp:rnd(0.5, 2.2), tint:Math.random() < 0.16}))}));
    draw(performance.now());
  }
  function drawShoot(t) {
    if (!shoot && t > nextShoot) {
      if (nextShoot) shoot = {x:rnd(W * 0.15, W * 0.85), y:rnd(0, H * 0.35), vx:(Math.random() < 0.5 ? 1 : -1) * rnd(0.6, 1), vy:rnd(0.25, 0.45), t0:t, life:rnd(700, 1100)};
      nextShoot = t + rnd(5000, 11000);
    }
    if (!shoot) return;
    const k = (t - shoot.t0) / shoot.life;
    if (k >= 1) { shoot = null; return; }
    const d = (t - shoot.t0) * 0.9, x = shoot.x + shoot.vx * d, y = shoot.y + shoot.vy * d, len = 120;
    const g = cx.createLinearGradient(x, y, x - shoot.vx * len, y - shoot.vy * len);
    g.addColorStop(0, 'rgba(255,255,255,' + (1 - k).toFixed(2) + ')'); g.addColorStop(1, 'rgba(255,255,255,0)');
    cx.globalAlpha = 1; cx.strokeStyle = g; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(x, y); cx.lineTo(x - shoot.vx * len, y - shoot.vy * len); cx.stroke();
  }
  function draw(t) {
    if (!cx) return;
    cx.clearRect(0, 0, W, H);
    const still = calm();
    for (const l of layers) {
      const ox = tx * 36 * l.depth, oy = ty * 36 * l.depth;
      for (const st of l.stars) {
        cx.globalAlpha = st.a * (still ? 1 : 0.6 + 0.4 * Math.sin(t / 1000 * st.sp + st.ph));
        cx.fillStyle = st.tint ? acc : '#ffffff';
        if (st.r < 1) cx.fillRect(st.x + ox, st.y + oy, st.r * 1.6, st.r * 1.6);
        else { cx.beginPath(); cx.arc(st.x + ox, st.y + oy, st.r, 0, 6.283); cx.fill(); }
      }
    }
    if (!still) drawShoot(t);
    cx.globalAlpha = 1;
  }
  function loop(t) {
    raf = 0;
    tx += (mx - tx) * 0.07; ty += (my - ty) * 0.07;
    draw(t);
    if (on && !document.hidden && !calm()) raf = requestAnimationFrame(loop);
  }
  function start() { if (!raf && on && cv) raf = requestAnimationFrame(loop); }
  let rzT = 0;
  return {
    init() {
      cv = document.getElementById('stars');
      if (!cv || !cv.getContext) { cv = null; return; }
      cx = cv.getContext('2d'); acc = P.a;
      build();
      addEventListener('resize', () => { clearTimeout(rzT); rzT = setTimeout(() => { build(); start(); }, 120); });
      document.addEventListener('visibilitychange', start);
      start();
    },
    mouse(x, y) { if (!W || !H) return; mx = (x / W - 0.5) * 2; my = (y / H - 0.5) * 2; if (calm()) { tx = mx; ty = my; } start(); },
    setAccent(c) { acc = c; },
    setOn(v) { on = !!v; if (cv) cv.style.display = on ? '' : 'none'; if (on) start(); },
    refresh() { if (cv) { draw(performance.now()); start(); } }
  };
})();

// ---------------------------------------------------------------- Start
async function boot() {
  Stars.init();
  applyPrefs();
  // ändert Windows die Animationseffekte (z. B. durch einen Tweak), passt sich Karito sofort an
  try { matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', () => { applyPrefs(); if (S.view === 'design') render(); }); } catch (e) {}
  if (real) $('#winctl').hidden = false;
  try { S.cfg = await API.config(); } catch (e) { S.cfg = {version:'2.0.0'}; }
  let lic = {tier:0}, list = null;
  try { [lic, list] = await Promise.all([API.license.status(), API.engine('List')]); } catch (e) { S.engineErr = String((e && e.message) || e); }
  S.tier = Number(lic && lic.tier) || 0; S.lic = lic || {};
  if (S.cfg.requireLogin !== false && !(lic && lic.loggedIn)) { S.view = 'login'; S.loginErr = lic && lic.msg && !/Entwicklermodus/.test(lic.msg) ? lic.msg : ''; }
  if (list && list.ok && list.data && Array.isArray(list.data.tweaks)) S.cat = {tweaks:list.data.tweaks, gamemode:list.data.gamemode || {groups:[], services:[]}};
  else { S.cat = EMBED; if (list) S.engineErr = firstMsg(list); }
  indexCatalog();
  if (!Array.isArray(P.gmGroups)) { P.gmGroups = (S.cat.gamemode.groups || []).filter(g => g.default).map(g => g.id); savePrefs(); }
  try { await refresh(); } catch (e) {}
  try { S.perf = JSON.parse(localStorage.getItem('kt-perf-v1') || '[]'); if (!Array.isArray(S.perf)) S.perf = []; } catch (e) { S.perf = []; }
  try { S.lastScan = JSON.parse(localStorage.getItem('kt-scan-v1') || '{}') || {}; } catch (e) { S.lastScan = {}; }
  try { const pi = JSON.parse(localStorage.getItem('kt-scanids-v1') || 'null'); S.prevIds = Array.isArray(pi) ? pi : null; } catch (e) { S.prevIds = null; }
  try { const sl = JSON.parse(localStorage.getItem('kt-strings-v1') || '[]'); S.strings = Array.isArray(sl) ? sl.filter(x => typeof x === 'string') : []; } catch (e) { S.strings = []; }
  if (real && window.karito.onProgress) window.karito.onProgress(onProgress);
  // Im Hintergrund: keine Animationen, kein Sternenhimmel – Karito zieht dann praktisch keine Leistung
  if (real && window.karito.onIdle) window.karito.onIdle(v => { S.idle = v; document.body.classList.toggle('idle', v); Stars.setOn(!v && P.stars !== false); });
  if (real && window.karito.onUpdate) window.karito.onUpdate(updateReady);
  API.onMonitor(onMon);
  if (real && window.karito.onAppStatus) window.karito.onAppStatus(st => { if (st && st.mode) { S.appStatus = st; render(); } });
  API.appStatus({}).then(st => { if (st && st.mode) { S.appStatus = st; render(); } }).catch(() => {});
  API.timer({action:'query'}).then(r => { if (r && r.ok !== false) { S.tmr = r; if (S.view === 'delay' || S.view === 'boost') render(); } }).catch(() => {});
  API.settings().then(r => { if (r) S.settings = r; }).catch(() => {});
  API.update({}).then(r => { if (r) { S.upd = r; if (r.state === 'ready') render(); } }).catch(() => {});
  render(); if (!maybeOnboarding()) maybeWhatsNew();
  API.hwid().then(h => { S.hwid = (h && h.hwid) || ''; const hv = $('#hwv'); if (hv) hv.textContent = S.hwid || '–'; if (S.view === 'license') render(); }).catch(() => {});
}
boot();
</script>
